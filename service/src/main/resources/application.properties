spring.application.name=sparkytc-service

sparkytc.application.environment=${APPLICATION_ENVIRONMENT:development}

# database
sparkytc.database.migration-mode=${DATABASE_MIGRATION_MODE}
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# jackson serialization
spring.jackson.serialization.write-dates-as-timestamps=true
spring.jackson.default-property-inclusion=non_null

# test case attachments (images and videos)
spring.servlet.multipart.max-file-size=${ATTACHMENT_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${ATTACHMENT_MAX_REQUEST_SIZE:200MB}

# jira integration, disabled unless the base url, email and api token are set
sparkytc.jira.base-url=${JIRA_BASE_URL:}
sparkytc.jira.email=${JIRA_EMAIL:}
sparkytc.jira.api-token=${JIRA_API_TOKEN:}
sparkytc.jira.project-key=${JIRA_PROJECT_KEY:SCRUM}
sparkytc.jira.issue-type=${JIRA_ISSUE_TYPE:Error}

# first admin account, created on startup when there are no users
sparkytc.admin.username=${ADMIN_USERNAME:}
sparkytc.admin.password=${ADMIN_PASSWORD:}
