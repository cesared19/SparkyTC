name: Feature request
description: Something SparkyTC should do, or do differently
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today? Describe the need, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we'll know it's done.
      placeholder: |
        - [ ] A tester can ...
        - [ ] Works on phones (390 px) and in dark mode
  - type: dropdown
    id: users
    attributes:
      label: Who needs it
      multiple: true
      options: [Testers, Admins, Other apps (integration API), Everyone]
