# Weekly pull requests to keep dependencies current. Minor and patch updates come grouped in one pull request
# per ecosystem; major updates come one by one, since they may need code changes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      client-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: gradle
    directory: /service
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      service-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: docker
    directories: [/client, /service]
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    labels: [dependencies]
