# Checks every pull request and every change to main: the backend tests, the client's types, lint and build,
# and that both Docker images build. A pull request can't be merged until these pass.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# a new push to a pull request cancels the checks still running for the previous one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # integration tests start PostgreSQL with Testcontainers, using the runner's Docker
      - run: ./gradlew test --no-daemon
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: service/build/reports/tests/test
          retention-days: 7

  client:
    name: Client types, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx tsc
      # the lint has no problems; any new one fails the check
      - run: npm run lint -- --max-warnings 0
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag sparkytc-service:ci service
      - run: docker build --tag sparkytc-client:ci client
