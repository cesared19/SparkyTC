services:
   backend-service:
      build:
         context: ./service
         dockerfile: Dockerfile
      environment:
         APPLICATION_ENVIRONMENT: production
         DATABASE_MIGRATION_MODE: ${DATABASE_MIGRATION_MODE}
         DATABASE_URL: ${DATABASE_URL}
         DATABASE_USERNAME: ${DATABASE_USERNAME}
         DATABASE_PASSWORD: ${DATABASE_PASSWORD}
         JIRA_BASE_URL: ${JIRA_BASE_URL:-}
         JIRA_EMAIL: ${JIRA_EMAIL:-}
         JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
         JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-SCRUM}
         JIRA_ISSUE_TYPE: ${JIRA_ISSUE_TYPE:-Error}
      # only reachable from the host itself, the client talks to the backend over app-network
      ports:
         - '127.0.0.1:8080:8080'
      networks:
         - app-network

   client-service:
      build:
         context: ./client
         dockerfile: Dockerfile
      environment:
         NODE_ENV: production
         VITE_API_URL: http://backend-service:8080
         CHERRY_PUBLIC_URL: ${CHERRY_PUBLIC_URL:-}
      ports:
         - '3000:3000'
      depends_on:
         - backend-service
      networks:
         - app-network

volumes:
   postgres_data:

networks:
   app-network:
      driver: bridge
